{% extends "wiki/base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<article class="note">
  <h1 class="note-title">Créer un compte</h1>
  <form method="post" class="form">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
    <div class="editor-actions">
      <button type="submit" class="button primary">Créer le compte</button>
    </div>
  </form>
  <p class="muted">Déjà inscrit ? <a href="{% url 'accounts:login' %}">Se connecter</a></p>
</article>
{% endblock %}
