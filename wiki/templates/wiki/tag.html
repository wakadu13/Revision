{% extends "wiki/base.html" %}
{% block title %}#{{ tag }}{% endblock %}
{% block content %}
<article class="note">
  <h1 class="note-title">#{{ tag }}</h1>
  <p class="muted">{{ notes|length }} note{{ notes|length|pluralize }}</p>
  <ul>
    {% for n in notes %}<li><a href="{{ n.url }}">{{ n.title }}</a>{% if n.folder %} <span class="muted">— {{ n.folder }}</span>{% endif %}</li>{% endfor %}
  </ul>
</article>
{% endblock %}
